services:
  - type: web
    name: aquasense-backend
    env: python
    buildCommand: pip install -r requirements.txt && python seed_admin.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aquasense-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: OPENWEATHER_API_KEY
        sync: false

  - type: web
    name: aquasense-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    rootDir: frontend
    envVars:
      - key: VITE_API_BASE
        value: https://aquasense-backend.onrender.com/api

databases:
  - name: aquasense-db
    databaseName: aquasense
    user: aquasense_user

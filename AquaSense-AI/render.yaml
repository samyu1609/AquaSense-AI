services:
  - type: web
    name: aquasense-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python seed_admin.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: DATABASE_URL
        fromDatabase:
          name: aquasense-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: OPENWEATHER_API_KEY
        sync: false

  - type: web
    name: aquasense-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://aquasense-ai-1-7kox.onrender.com/api

databases:
  - name: aquasense-db
    databaseName: aquasense
    user: aquasense_user
    plan: free
